<!DOCTYPE html>
<html lang="en">
<head>

        .config-group { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 10px; }
        input { background: #2a2a3a; color: white; border: 1px solid #444; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .btn { padding: 12px; margin: 5px; border-radius: 8px; border: none; cursor: pointer; color: white; font-weight: bold; width: 100%; }
        .btn-start { background: #34c759; } .btn-pause { background: #ff9f0a; } .btn-stop { background: #ff3b30; }

    </div>

    <canvas id="output_canvas" width="640" height="480"></canvas>

    <script>
        // --- LÓGICA DE NOMBRE ---
        const nameInput = document.getElementById('user-name-input');
        function saveName() {
            localStorage.setItem('visionFitUserName', nameInput.value);
            document.getElementById('user-profile').innerText = "👤 " + nameInput.value;
        }

        window.onload = () => {
            const savedName = localStorage.getItem('visionFitUserName') || "Atleta";
            nameInput.value = savedName;
            document.getElementById('user-profile').innerText = "👤 " + savedName;
        };

        // --- LÓGICA DE HISTORIAL ---
        let workoutHistoryLogs = JSON.parse(localStorage.getItem('visionFitHistory')) || {};

</body>
</html>
