<div id="user-profile" style="margin: 10px; font-size: 0.9rem; color: #00ff88;"></div>

<script>
    // --- NUEVA LÓGICA DE USUARIO Y LOCALSTORAGE ---
    let userName = localStorage.getItem('visionFitUserName');
    if (!userName) {
        userName = prompt("¡Bienvenido a VisionFit! ¿Cómo te llamas?") || "Atleta";
        localStorage.setItem('visionFitUserName', userName);
    }
    document.getElementById('user-profile').innerText = "👤 Atleta: " + userName;

    // Cargar historial al iniciar
    let savedHistory = localStorage.getItem('visionFitHistory');
    let workoutHistoryLogs = savedHistory ? JSON.parse(savedHistory) : {};

    function saveHistoryToLocalStorage() {
        localStorage.setItem('visionFitHistory', JSON.stringify(workoutHistoryLogs));
    }

    // --- MODIFICA TU FUNCIÓN forceFullStop EXISTENTE PARA ESTO ---
    function forceFullStop() {
        const langData = translations[languageSelector.value];
        if(timerIntervalId) clearInterval(timerIntervalId);
        
        saveCurrentExerciseToHistory();
        totalSessionSecondsAccumulated += activeExerciseSeconds;

        // GUARDADO AUTOMÁTICO
        saveHistoryToLocalStorage();

        isWorkoutActive = false; isWorkoutPaused = false;
        btnPause.disabled = true; btnStop.disabled = true;
        instructions.innerText = langData.stop + " (Saved to history)";
        txtSpeed.innerText = langData.stopped; 
        txtGoalTime.innerText = langData.finished;

        cameraBox.style.display = "none";
        buildFinalReceiptMarkup();
        receiptContainer.style.display = "block";
    }

    // ... [MANTÉN EL RESTO DE TU CÓDIGO ORIGINAL AQUÍ] ...

    // TIP: Para ver el historial en consola en cualquier momento, 
    // puedes llamar a: console.log(JSON.parse(localStorage.getItem('visionFitHistory')));
</script>
