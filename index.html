    <!-- 1. Contenedores UI -->
    <div id="user-profile" style="margin: 10px; font-size: 0.9rem; color: #00ff88;"></div>
    <!-- ... resto de tu HTML original ... -->

    <script>
        // 1. Inicialización de variables y elementos
        // ... (tus constantes y variables globales)

        // 2. Lógica de Usuario (ahora consolidada)
        let userName = localStorage.getItem('visionFitUserName') || (() => {
            let name = prompt("¡Bienvenido! ¿Cómo te llamas?") || "Atleta";
            localStorage.setItem('visionFitUserName', name);
            return name;
        })();
        document.getElementById('user-profile').innerText = "👤 Atleta: " + userName;

        let workoutHistoryLogs = JSON.parse(localStorage.getItem('visionFitHistory') || "{}");
        
        function saveHistoryToLocalStorage() {
            localStorage.setItem('visionFitHistory', JSON.stringify(workoutHistoryLogs));
        }

        // 3. Función consolidada
        function forceFullStop() {
            const langData = translations[languageSelector.value];
            if(timerIntervalId) clearInterval(timerIntervalId);
            
            saveCurrentExerciseToHistory();
            totalSessionSecondsAccumulated += activeExerciseSeconds;
            saveHistoryToLocalStorage(); // GUARDADO INTEGRADO

            isWorkoutActive = false;
            isWorkoutPaused = false;
            btnPause.disabled = true;
            btnStop.disabled = true;
            instructions.innerText = langData.stop + " (Saved)";
            
            cameraBox.style.display = "none";
            buildFinalReceiptMarkup();
            receiptContainer.style.display = "block";
        }

        // 4. Tus demás funciones (onResults, initVoiceControl, etc)
        // ... 
    </script>
