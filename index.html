<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionFit Tracker</title>
    <style>
        body { font-family: sans-serif; background-color: #0f0f12; color: white; text-align: center; margin: 0; padding: 10px; }
        .panel { background: #1a1a24; padding: 15px; border-radius: 12px; margin: 10px auto; max-width: 400px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #222230; padding: 10px; border-radius: 8px; }
        .stat-val { font-size: 1.2rem; font-weight: bold; display: block; }
        .btn { border: none; padding: 15px; font-size: 1rem; border-radius: 8px; cursor: pointer; color: white; width: 100%; margin: 5px 0; }
        .btn-start { background: #34c759; } .btn-pause { background: #ff9f0a; } .btn-stop { background: #ff3b30; }
    </style>
</head>
<body>

    <div id="user-profile" style="color: #00ff88; font-weight: bold; margin: 10px;"></div>
    <h1>VisionFit Tracker</h1>
    
    <div class="panel">
        <div class="stats-grid">
            <div class="stat-box"><span class="stat-val" id="val-reps">0</span>Reps</div>
            <div class="stat-box"><span class="stat-val" id="val-time">00:00</span>Time</div>
            <div class="stat-box"><span class="stat-val" id="val-cals">0.0</span>KCal</div>
        </div>
        <button class="btn btn-start" id="btn-start">▶️ Start</button>
        <button class="btn btn-pause" id="btn-pause">⏸️ Pause</button>
        <button class="btn btn-stop" id="btn-stop">🛑 Stop</button>
    </div>

    <div id="history-panel" class="panel" style="display:none; text-align: left;">
        <h3>Historial:</h3>
        <div id="history-list"></div>
    </div>

    <script>
        // 1. Perfil y Historial
        let userName = localStorage.getItem('visionFitUserName') || "Amalia";
        document.getElementById('user-profile').innerText = "👤 " + userName;
        let logs = JSON.parse(localStorage.getItem('visionFitHistory')) || [];

        // 2. Elementos
        const btnStart = document.getElementById('btn-start'), btnPause = document.getElementById('btn-pause'), btnStop = document.getElementById('btn-stop');
        let isRunning = false;

        // 3. Funciones Básicas
        btnStart.onclick = () => { isRunning = true; alert("Iniciando..."); };
        btnPause.onclick = () => { alert("Pausado"); };
        
        btnStop.onclick = () => {
            isRunning = false;
            let log = { date: new Date().toLocaleDateString(), reps: document.getElementById('val-reps').innerText };
            logs.push(log);
            localStorage.setItem('visionFitHistory', JSON.stringify(logs));
            document.getElementById('history-panel').style.display = 'block';
            document.getElementById('history-list').innerHTML += `<p>${log.date}: ${log.reps} reps</p>`;
            alert("Entrenamiento guardado");
        };

        // 4. Voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.onresult = (e) => {
                const cmd = e.results[e.results.length-1][0].transcript.toLowerCase();
                if(cmd.includes("start")) btnStart.click();
                if(cmd.includes("pausa")) btnPause.click();
                if(cmd.includes("stop")) btnStop.click();
            };
            rec.start();
        }
    </script>
</body>
</html>
