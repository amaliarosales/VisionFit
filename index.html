<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionFit Engine v17.1 - Summary Goal Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f12; color: white; text-align: center; margin: 0; padding: 5px; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 1.1rem; margin: 5px 0; }
        .lang-container { position: absolute; top: 15px; right: 20px; z-index: 100; }
        .lang-select { background: #1a1a24; color: #00ff88; border: 1px solid #00ff88; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .capture-zone { width: 100%; max-width: 400px; padding: 10px; }
        .panel { background: #1a1a24; padding: 10px; border-radius: 12px; border: 1px solid #2a2a3a; margin-bottom: 10px; }
        .video-container { width: 100%; max-width: 400px; aspect-ratio: 4 / 3; background: #000; border-radius: 12px; overflow: hidden; margin: 10px auto; }
        #output_canvas { width: 100%; height: 100%; object-fit: cover; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .stat-box { background: #222230; padding: 8px 4px; border-radius: 8px; border-bottom: 3px solid #fff; }
        .stat-val { font-size: 0.9rem; font-weight: bold; display: block; }
        .stat-lbl { font-size: 0.5rem; color: #aaa; text-transform: uppercase; }
        .btn { color: white; border: none; padding: 10px; font-size: 0.8rem; border-radius: 8px; cursor: pointer; flex: 1; }
        .btn-start { background: #34c759; } .btn-pause { background: #ff9f0a; } .btn-stop { background: #ff3b30; }
        .summary-receipt { background: #1e1e2a; border: 2px dashed #444; border-radius: 12px; padding: 20px; margin-top: 15px; display: none; text-align: left; }
    </style>
</head>
<body>

    <div class="lang-container">
        <select id="language-selector" class="lang-select">
            <option value="en" selected>🌐 English</option>
            <option value="es">🌐 Español</option>
        </select>
    </div>

    <div id="user-profile" style="font-size: 0.9rem; color: #00ff88; margin-top: 5px;"></div>
    <h1 id="main-title">VisionFit Tracker</h1>
    <p class="status" id="instructions">System Online.</p>

    <div class="capture-zone" id="workout-card-area">
        <div class="panel">
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-val" id="val-reps">0</span><span class="stat-lbl" id="lbl-reps">Reps</span></div>
                <div class="stat-box"><span class="stat-val" id="val-time">00:00</span><span class="stat-lbl" id="lbl-time">Time</span></div>
                <div class="stat-box"><span class="stat-val" id="val-cals">0.0</span><span class="stat-lbl" id="lbl-cals">KCal</span></div>
            </div>
            <div style="display:flex; gap: 5px; margin-top: 10px;">
                <button class="btn btn-start" id="btn-start">▶️ Start</button>
                <button class="btn btn-pause" id="btn-pause" disabled>⏸️ Pause</button>
                <button class="btn btn-stop" id="btn-stop" disabled>🛑 Stop</button>
            </div>
        </div>
        <div id="receipt-container" class="summary-receipt"></div>
        <div class="video-container" id="camera-box"><video id="webcam" autoplay playsinline></video><canvas id="output_canvas" width="640" height="480"></canvas></div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN USUARIO Y STORAGE ---
        let userName = localStorage.getItem('visionFitUserName') || (prompt("¿Cómo te llamas?") || "Atleta");
        localStorage.setItem('visionFitUserName', userName);
        document.getElementById('user-profile').innerText = "👤 " + userName;

        let workoutHistoryLogs = JSON.parse(localStorage.getItem('visionFitHistory')) || {};
        
        // --- 2. VARIABLES Y LÓGICA EXISTENTE ---
        const videoElement = document.getElementById('webcam'), canvasElement = document.getElementById('output_canvas'), canvasCtx = canvasElement.getContext('2d');
        let isWorkoutActive = false, isWorkoutPaused = false, reps = 0, activeExerciseSeconds = 0, timerIntervalId = null;
        const btnStart = document.getElementById('btn-start'), btnPause = document.getElementById('btn-pause'), btnStop = document.getElementById('btn-stop');

        // --- 3. FUNCIÓN DE PARADA (MODIFICADA PARA GUARDAR) ---
        function forceFullStop() {
            if(timerIntervalId) clearInterval(timerIntervalId);
            
            // Guardado automático
            const timestamp = new Date().toLocaleString();
            workoutHistoryLogs[timestamp] = { reps: reps, calories: document.getElementById('val-cals').innerText, time: document.getElementById('val-time').innerText };
            localStorage.setItem('visionFitHistory', JSON.stringify(workoutHistoryLogs));

            isWorkoutActive = false;
            document.getElementById('camera-box').style.display = "none";
            document.getElementById('receipt-container').style.display = "block";
            document.getElementById('receipt-container').innerHTML = `<h3>Saved to History!</h3><p>Session: ${reps} reps saved.</p>`;
        }

        btnStop.addEventListener('click', forceFullStop);

        // --- 4. CONTROL DE VOZ ---
        function initVoiceControl() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.onresult = (event) => {
                const cmd = event.results[event.results.length - 1][0].transcript.toLowerCase();
                if (cmd.includes("pausa")) { if (isWorkoutActive) btnPause.click(); }
                else if (cmd.includes("sigue")) { if (isWorkoutPaused) btnPause.click(); }
                else if (cmd.includes("stop")) { forceFullStop(); }
            };
            recognition.onend = () => setTimeout(() => recognition.start(), 1000);
            try { recognition.start(); } catch(e) {}
        }
        initVoiceControl();

        // Inicialización básica MediaPipe (mantenida de tu original)
        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.onResults((results) => { /* ... tu lógica de onResults ... */ });
        new Camera(videoElement, { onFrame: async () => { await pose.send({ image: videoElement }); }, width: 640, height: 480 }).start();
    </script>
</body>
</html>
