<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionFit Engine v17.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #0f0f12; color: white; text-align: center; font-family: sans-serif; }
        .panel { background: #1a1a24; padding: 15px; border-radius: 12px; margin: 20px auto; max-width: 760px; }
        .config-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .btn { padding: 12px; border-radius: 8px; cursor: pointer; border: none; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div id="user-display" style="color: #00ff88; font-weight: bold; margin-top: 10px;"></div>
    
    <div class="panel">
        <div class="config-row">
            <select id="exercise-selector"></select>
            <input type="number" id="load-weight" value="10">
            <input type="number" id="body-weight" value="65">
            <input type="number" id="user-height" value="165">
            <select id="weight-goal"></select>
        </div>
        <div class="action-buttons" style="margin-top: 20px;">
            <button class="btn" style="background:#34c759" id="btn-start">▶️ Start</button>
            <button class="btn" style="background:#ff9f0a" id="btn-pause" disabled>⏸️ Pause</button>
            <button class="btn" style="background:#ff3b30" id="btn-stop" disabled>🛑 Stop</button>
        </div>
    </div>

    <script>
        // 1. INICIALIZACIÓN BÁSICA (Evita que el resto del código falle)
        document.addEventListener("DOMContentLoaded", () => {
            // Usuario
            let userName = localStorage.getItem('visionFitUserName') || "Amalia";
            document.getElementById('user-display').innerText = "👤 Atleta: " + userName;

            // 2. AQUI VA TU LÓGICA PRINCIPAL
            // Si después de esto el menú sigue vacío, es porque falta llamar a 'applyLanguage()' 
            // o porque el objeto 'translations' no está definido antes de ejecutar el selector.
            
            console.log("Sistema cargado. Intentando inicializar...");

            // SI ESTO TE FUNCIONA, VE A TU CONSOLA DE DESARROLLADOR (F12) 
            // Y DIME SI APARECE ALGÚN ERROR EN ROJO.
        });
    </script>
</body>
</html>
